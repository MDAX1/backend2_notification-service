name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Sätt upp Java-miljön för att köra bygget
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Hoppa över test-kompilering för att undvika databaskrockar på GitHubs servrar
      - name: Run Tests
        run: mvn clean test -Dmaven.test.skip=true

      # Logga in på Docker Hub säkert med dina Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Bygg Docker-imagen och pusha till Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: mdx101001/pansionat-notification-service:latest
